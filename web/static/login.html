<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · MediX</title><link rel="icon" href="/assets/companion.svg"><link rel="stylesheet" href="/assets/auth.css"><script src="/assets/auth.js" defer></script><script src="/assets/login.js" defer></script></head>
<body><main class="auth-shell"><section class="auth-story"><a class="wordmark" href="/login"><span>＋</span>MediX</a><div><div class="eyebrow">YOUR HEALTH, YOUR SPACE</div><h1>让每一次关心，<br>都有自己的空间。</h1><p>从身体的小变化，到每天的好习惯。<br>登录你的账号，继续与健康助手的对话。</p></div><img class="story-art" src="/assets/companion.svg" alt="MediX 健康伙伴"><div class="story-foot">健康问答 · 报告解读 · 日常陪伴<br>AI 回答仅供参考，不能替代医生诊断。</div></section>
<section class="auth-main"><div class="auth-card"><div class="step-label">WELCOME TO MEDIX</div><h2 id="formTitle">欢迎回来</h2><p class="intro" id="formIntro">登录账号，开启今天的健康对话。</p><div class="tabs" role="tablist" aria-label="登录或注册"><button id="loginTab" role="tab" aria-selected="true" aria-controls="authForm">登录</button><button id="registerTab" role="tab" aria-selected="false" aria-controls="authForm">注册账号</button></div>
<form id="authForm"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" placeholder="字母、数字或下划线" required><div id="nameField" hidden><label for="displayName">怎么称呼你</label><input id="displayName" name="display_name" autocomplete="nickname" maxlength="60" placeholder="你的展示名称"></div><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><p class="hint" id="passwordHint" hidden>使用 15–128 个字符，建议选择容易记住的长口令。</p><div id="confirmField" hidden><label for="confirmPassword">确认密码</label><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128"></div><button class="primary auth-submit" id="submitButton" type="submit">登录我的空间 →</button><p class="feedback" id="feedback" role="status" aria-live="polite"></p></form><p class="footnote">建议使用虚构资料进行演示。模型分析可能涉及外部服务，请勿上传未经授权的真实病历。</p></div></section></main></body></html>
