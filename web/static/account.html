<!doctype html>
<html lang="zh-CN" data-auth-pending><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号与安全 · MediX</title><link rel="icon" href="/assets/companion.svg"><link rel="stylesheet" href="/assets/auth.css"><script src="/assets/auth.js" defer></script><script src="/assets/password-policy.js?v=3" defer></script><script src="/assets/account.js?v=3" defer></script><link rel="stylesheet" href="/assets/password-policy.css?v=1"></head><body><main class="account-shell"><header class="account-header"><a class="wordmark" href="/"><span>＋</span>MediX</a><a href="/">← 返回健康对话</a></header><div class="account-title"><div class="eyebrow">ACCOUNT & SECURITY</div><h1>账号与安全</h1><p class="intro">管理你的登录状态和账号访问。</p></div><div class="account-grid"><section class="panel"><h2>我的账号</h2><div class="identity" id="displayName"></div><p id="username"></p><span class="badge" id="role"></span><p>退出全部设备会撤销当前账号的所有登录。</p><div class="actions"><button id="logout" class="secondary">退出当前设备</button><button id="logoutAll" class="secondary">退出全部设备</button></div></section><section class="panel"><h2>修改密码</h2><form id="passwordForm"><input id="passwordUsername" name="username" autocomplete="username" hidden><label for="oldPassword">当前密码</label><input id="oldPassword" type="password" autocomplete="current-password" required spellcheck="false" autocapitalize="none" autocorrect="off"><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required spellcheck="false" autocapitalize="none" autocorrect="off"><p class="hint" id="newPasswordHint">8–20 位。修改后需重新登录。</p><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required spellcheck="false" autocapitalize="none" autocorrect="off"><button class="primary auth-submit" type="submit">保存新密码</button></form></section></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><section id="adminPanel" class="panel admin-panel" hidden><h2>用户管理</h2><p>管理普通账号的启用状态。停用会撤销该用户全部登录。</p><div class="table-wrap"><table><thead><tr><th>用户名</th><th>展示名称</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div><div class="pagination"><button class="secondary" id="previous">上一页</button><span id="pageInfo"></span><button class="secondary" id="next">下一页</button></div></section></main></body></html>
